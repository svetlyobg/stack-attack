<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stack Attack</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; background:#f5893f; color:#1c0f06; font-family:system-ui,Segoe UI,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px; user-select:none; }
  h1 { margin:0; font-size:22px; letter-spacing:3px; color:#1c0f06; }
  #hud { display:flex; gap:22px; font-size:15px; font-variant-numeric:tabular-nums; }
  #hud b { color:#1c0f06; }
  #hud { align-items:center; }
  #langBtn { padding:2px 8px; font-size:13px; font-weight:700; border:2px solid #1c0f06; border-radius:6px; background:transparent; color:#1c0f06; }
  #langBtn:hover { background:#1c0f06; color:#f5893f; }
  #wrap { position:relative; }
  html, body { touch-action:manipulation; overscroll-behavior:none; }
  canvas { background:#f5893f; border:5px solid #1c0f06; image-rendering:pixelated; display:block;
           width:auto; height:auto; max-width:calc(100vw - 20px); max-height:calc(100vh - 120px); }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(245,137,63,.93); border:5px solid #1c0f06; text-align:center; padding:20px; gap:8px; }
  #overlay h2 { margin:0; font-size:30px; color:#1c0f06; }
  #overlay p { margin:0; color:#1c0f06; font-size:14px; line-height:1.5; }
  button { font:inherit; cursor:pointer; }
  #startBtn { margin-top:10px; padding:10px 26px; font-size:16px; font-weight:700; border:0; border-radius:8px; background:#1c0f06; color:#f5893f; }
  #pad { display:none; gap:10px; width:100%; max-width:432px; }
  #pad button { flex:1; height:68px; font-size:28px; border-radius:12px; border:3px solid #1c0f06; background:#f5893f; color:#1c0f06;
                touch-action:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #pad button:active { background:#1c0f06; color:#f5893f; }
  #pad .gap { flex:.4; }
  @media (pointer:coarse) {
    body { justify-content:flex-start; gap:6px; padding:8px; }
    h1 { font-size:18px; }
    #hud { font-size:14px; gap:14px; }
    #pad { display:flex; }
    .hint { display:none; }
    .kb { display:none; }
    canvas { max-height:calc(100vh - 175px); max-height:calc(100dvh - 175px); }
    #overlay p { font-size:13px; }
  }
  @media not (pointer:coarse) { .touch { display:none; } }
  .hint { font-size:12px; color:#5a2e10; }
</style>
</head>
<body>
<h1>STACK ATTACK</h1>
<div id="hud">
  <div><span data-i18n="score">Точки</span>: <b id="score">0</b></div>
  <div><span data-i18n="lines">Редове</span>: <b id="lines">0</b></div>
  <div><span data-i18n="best">Рекорд</span>: <b id="best">0</b></div>
  <button id="langBtn" title="Language / Език">EN</button>
</div>
<div id="wrap">
  <canvas id="c" width="432" height="504"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">STACK ATTACK</h2>
    <p id="ovText"></p>
    <button id="startBtn"></button>
  </div>
</div>
<div id="pad">
  <button id="bL">◀</button><button id="bR">▶</button><span class="gap"></span><button id="bU">▲</button>
</div>
<div class="hint" data-i18n="hint"></div>

<script>
(() => {
  const COLS = 12, ROWS = 14, S = 36;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---- translations ----
  const T = {
    bg: {
      score: 'Точки', lines: 'Редове', best: 'Рекорд', switchTo: 'EN',
      intro: 'Кутии падат отгоре. Бутай ги встрани и подреждай пълни редове, за да изчезнат.<br>' +
             'Ако кутия падне върху теб или купчината стигне върха — край!<br><br>',
      kb: '<b>← →</b> / A D — движение и бутане<br>' +
          '<b>↑</b> / W / интервал — скок (докато си във въздуха, натисни посока, за да стъпиш върху кутия)<br>' +
          '<b>P</b> — пауза',
      touch: '<b>◀ ▶</b> — движение и бутане<br><b>▲</b> — скок (после ◀ или ▶, за да стъпиш върху кутия)',
      start: 'Старт', newGame: 'Нова игра', resume: 'Продължи',
      pause: 'Пауза', pauseText: 'Натисни P или Продължи.',
      crushed: 'Премазан!', top: 'Купчината стигна върха!',
      result: (s, l) => 'Резултат: <b>' + s + '</b> · Редове: <b>' + l + '</b>',
      hint: 'Подсказка: бутай кутия към дупка, за да допълниш ред. Скочи с ↑ и натисни посока, за да се качиш на кутия.'
    },
    en: {
      score: 'Score', lines: 'Lines', best: 'Best', switchTo: 'БГ',
      intro: 'Boxes fall from above. Push them sideways and complete full rows to clear them.<br>' +
             'If a box lands on you or the stack reaches the top — game over!<br><br>',
      kb: '<b>← →</b> / A D — move and push<br>' +
          '<b>↑</b> / W / Space — jump (while in the air, press a direction to step onto a box)<br>' +
          '<b>P</b> — pause',
      touch: '<b>◀ ▶</b> — move and push<br><b>▲</b> — jump (then ◀ or ▶ to step onto a box)',
      start: 'Start', newGame: 'New game', resume: 'Resume',
      pause: 'Paused', pauseText: 'Press P or Resume.',
      crushed: 'Crushed!', top: 'The stack reached the top!',
      result: (s, l) => 'Score: <b>' + s + '</b> · Lines: <b>' + l + '</b>',
      hint: 'Tip: push a box into a gap to complete a row. Press ↑ to jump, then a direction to climb onto a box.'
    }
  };
  let lang = localStorage.getItem('stackAttackLang') ||
             ((navigator.language || '').toLowerCase().startsWith('bg') ? 'bg' : 'en');
  let deathReason = 'crushed';
  const t = k => T[lang][k];

  function renderOverlay() {
    const L = T[lang];
    if (state === 'pause') {
      $('ovTitle').textContent = L.pause; $('ovText').textContent = L.pauseText; $('startBtn').textContent = L.resume;
    } else if (state === 'over') {
      $('ovTitle').textContent = L[deathReason]; $('ovText').innerHTML = L.result(score, lines); $('startBtn').textContent = L.newGame;
    } else {
      $('ovTitle').textContent = 'STACK ATTACK';
      $('ovText').innerHTML = L.intro + '<span class="kb">' + L.kb + '</span><span class="touch">' + L.touch + '</span>';
      $('startBtn').textContent = L.start;
    }
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    $('langBtn').textContent = t('switchTo');
    renderOverlay();
  }
  $('langBtn').onclick = () => {
    lang = lang === 'bg' ? 'en' : 'bg';
    localStorage.setItem('stackAttackLang', lang);
    applyLang();
    $('langBtn').blur(); // keep Space for jumping
  };

  const INK = '#1c0f06', ORANGE = '#f5893f';
  const COLORS = [INK, INK, INK, INK, INK]; // 5 box types (icons), monochrome LCD
  // dithered "sky" texture, precomputed once
  const sky = document.createElement('canvas'); sky.width = COLS * S; sky.height = S * 5;
  (() => {
    const g = sky.getContext('2d'); g.fillStyle = INK;
    for (let y = 0; y < sky.height; y += 4) for (let x = 0; x < sky.width; x += 4) {
      const d = 1 - y / sky.height;
      if (((x / 4 + y / 4) % 2 === 0 && Math.random() < d * 1.1) || Math.random() < d * d * .5) g.fillRect(x, y, 3, 3);
    }
  })();

  let grid, loose, player, score, lines, best, state, spawnT, elapsed, moveCd, fallT, shake, particles, hang = 0;
  best = +localStorage.getItem('stackAttackBest') || 0;
  $('best').textContent = best;

  const keys = { left:false, right:false, up:false };

  function reset() {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    loose = [];
    particles = [];
    player = { c: COLS >> 1, r: ROWS - 1, dx: COLS >> 1, dy: ROWS - 1, face: 1 };
    score = 0; lines = 0; elapsed = 0; spawnT = 1.5; moveCd = 0; fallT = 0; shake = 0; hang = 0;
    updateHud();
  }
  function updateHud() {
    $('score').textContent = score; $('lines').textContent = lines; $('best').textContent = best;
  }

  const free = (r, c) => c >= 0 && c < COLS && r >= 0 && r < ROWS && !grid[r][c];
  const filled = (r, c) => c >= 0 && c < COLS && r >= 0 && r < ROWS && grid[r][c];

  function spawn() {
    const n = elapsed > 150 && Math.random() < 0.25 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const c = Math.floor(Math.random() * COLS);
      if (loose.some(b => b.c === c && b.y < 1)) continue;
      loose.push({ c, y: -1, sky: true, color: 1 + Math.floor(Math.random() * COLORS.length) });
    }
  }

  // blocks with nothing beneath start to fall
  function settleGrid() {
    for (let c = 0; c < COLS; c++)
      for (let r = ROWS - 2; r >= 0; r--)
        if (grid[r][c] && !grid[r + 1][c] && !loose.some(b => b.c === c && Math.floor(b.y) === r)) {
          loose.push({ c, y: r, color: grid[r][c] });
          grid[r][c] = 0;
        }
  }

  function burst(x, y, color) {
    for (let i = 0; i < 6; i++)
      particles.push({ x, y, vx: (Math.random() - .5) * 220, vy: -Math.random() * 200, life: .5, color });
  }

  function checkRows() {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(v => v)) {
        for (let c = 0; c < COLS; c++) burst(c * S + S / 2, r * S + S / 2, COLORS[grid[r][c] - 1]);
        grid.splice(r, 1);
        grid.unshift(Array(COLS).fill(0));
        loose.forEach(b => { if (b.y < r) b.y += 1; });
        if (player.r < r) { player.r++; }
        lines++; score += 100 + Math.min(lines, 20) * 5;
        shake = .25;
        updateHud();
        r++; // re-check same index
      }
    }
  }

  function die(reason) {
    state = 'over'; deathReason = reason;
    if (score > best) { best = score; localStorage.setItem('stackAttackBest', best); }
    updateHud();
    renderOverlay();
    $('overlay').style.display = 'flex';
  }

  const onGround = () => player.r === ROWS - 1 || !!grid[player.r + 1][player.c];

  // hop one cell up; while in the air you can step sideways onto a box
  function jump() {
    if (state !== 'play' || !onGround()) return;
    if (!free(player.r - 1, player.c)) return;
    player.r--; hang = .45;
  }

  function tryMove(dir) {
    const { c, r } = player;
    player.face = dir;
    const c2 = c + dir;
    if (c2 < 0 || c2 >= COLS) return;
    const canClimb = () => filled(r, c2) && free(r - 1, c2) && free(r - 1, c) && !loose.some(b => b.c === c2 && b.y > r - 3 && b.y < r);
    if (free(r, c2)) {
      if (loose.some(b => b.c === c2 && b.y + 1 > r && b.y < r + 1)) return; // don't walk into a falling block
      player.c = c2; return;
    }
    // push the box together with everything stacked on top of it (only with feet on the ground)
    const c3 = c2 + dir;
    let top = r;
    while (top > 0 && grid[top - 1][c2]) top--;
    const clear = rr => free(rr, c3) && !loose.some(b => b.c === c3 && b.y + 1 > rr && b.y < rr + 1);
    let canPush = onGround() && c3 >= 0 && c3 < COLS;
    for (let rr = top; canPush && rr <= r; rr++) canPush = clear(rr);
    if (canPush) {
      for (let rr = top; rr <= r; rr++) { grid[rr][c3] = grid[rr][c2]; grid[rr][c2] = 0; }
      player.c = c2;
      settleGrid();
      checkRows();
    } else if (canClimb()) { player.c = c2; player.r = r - 1; }
  }

  function update(dt) {
    elapsed += dt;
    // spawn
    // only a limited number of boxes in the air at once: 1 at first, more later
    const maxAir = elapsed < 60 ? 1 : elapsed < 150 ? 2 : 3;
    spawnT -= dt;
    if (spawnT <= 0 && loose.filter(b => b.sky).length < maxAir) {
      spawn();
      spawnT = Math.max(.7, 3.2 - elapsed * 0.01) * (0.8 + Math.random() * 0.4);
    }
    // player input
    moveCd -= dt;
    if (moveCd <= 0) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir) { tryMove(dir); moveCd = .12; }
    }
    // player gravity (paused briefly at the top of a jump)
    if (hang > 0) hang -= dt;
    fallT -= dt;
    if (hang <= 0 && fallT <= 0) {
      if (!onGround()) { player.r++; fallT = .07; }
    }
    // falling blocks
    const speed = 1.6 + Math.min(elapsed * 0.012, 4.5);
    for (let i = loose.length - 1; i >= 0; i--) {
      const b = loose[i];
      b.y += (b.fast ? 14 : speed) * dt;
      const r = Math.floor(b.y);
      // crushed?
      if (b.c === player.c && b.y + 1 > player.r + .15 && b.y < player.r + .85) { return die('crushed'); }
      const below = r + 1;
      const blockedBy = below >= ROWS || (below >= 0 && grid[below][b.c]);
      // stop when another loose block lands directly under (handled by grid once it lands)
      if (blockedBy && b.y >= r) {
        b.y = r;
        if (r < 0) { return die('top'); }
        if (grid[r][b.c]) { return die('top'); }
        if (player.c === b.c && player.r === r) { return die('crushed'); }
        grid[r][b.c] = b.color;
        loose.splice(i, 1);
        if (r === 0) return die('top');
        score += 2;
        checkRows();
      }
    }
    // player standing in a cell that turned solid
    if (grid[player.r][player.c]) return die('crushed');
    // smooth render pos
    const k = Math.min(1, dt * 22);
    player.dx += (player.c - player.dx) * k;
    player.dy += (player.r - player.dy) * k;
    // particles
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
    if (shake > 0) shake -= dt;
    updateHud();
  }

  function drawBlock(x, y, ci) {
    x = Math.round(x); y = Math.round(y);
    const f = (a, b, w, h) => ctx.fillRect(x + a, y + b, w, h);
    ctx.fillStyle = ORANGE; f(1, 1, S - 2, S - 2);
    ctx.fillStyle = INK;
    f(1, 1, S - 2, 3); f(1, S - 4, S - 2, 3); f(1, 1, 3, S - 2); f(S - 4, 1, 3, S - 2); // frame
    const m = S / 2;
    switch (ci) {
      case 1: // X
        for (let i = 0; i < 16; i += 2) { f(10 + i, 10 + i, 3, 3); f(23 - i, 10 + i, 3, 3); }
        break;
      case 2: // slot
        f(9, 13, 18, 3); f(9, 21, 18, 3); f(9, 13, 3, 11); f(24, 13, 3, 11); f(15, 17, 9, 3);
        break;
      case 3: // ball
        f(13, 8, 10, 3); f(13, 25, 10, 3); f(8, 13, 3, 10); f(25, 13, 3, 10);
        f(10, 10, 4, 4); f(22, 10, 4, 4); f(10, 22, 4, 4); f(22, 22, 4, 4);
        f(11, 11, 14, 14);
        break;
      case 4: // smile
        f(10, 18, 3, 3); f(13, 21, 3, 3); f(16, 22, 4, 3); f(20, 21, 3, 3); f(23, 18, 3, 3);
        break;
      default: // eyes + frown
        f(9, 11, 6, 7); f(21, 11, 6, 7); f(12, 25, 12, 3); f(10, 27, 3, 2); f(23, 27, 3, 2);
    }
  }

  function drawPlayer() {
    const x = Math.round(player.dx * S), y = Math.round(player.dy * S);
    const f = (a, b, w, h) => ctx.fillRect(player.face > 0 ? x + a : x + S - a - w, y + b, w, h);
    ctx.fillStyle = INK;
    f(10, 1, 14, 5); f(20, 4, 9, 3);             // cap + visor
    f(10, 6, 3, 9); f(22, 6, 3, 9); f(10, 13, 15, 3); // head outline
    f(18, 8, 3, 4);                              // eye
    f(8, 17, 19, 3); f(8, 22, 19, 3);            // striped shirt
    f(8, 17, 3, 11); f(24, 17, 3, 11); f(8, 27, 19, 2);
    f(10, 29, 5, 6); f(20, 29, 5, 6);            // legs
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 5, (Math.random() - .5) * 5);
    ctx.clearRect(-10, -10, cv.width + 20, cv.height + 20);
    ctx.fillStyle = ORANGE; ctx.fillRect(-10, -10, cv.width + 20, cv.height + 20);
    ctx.drawImage(sky, 0, 0);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c]) drawBlock(c * S, r * S, grid[r][c]);
    loose.forEach(b => drawBlock(b.c * S, b.y * S, b.color));
    if (state !== 'over') drawPlayer();
    particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 5, 5); });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = 0;
  function loop(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    if (state === 'play') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset(); state = 'play';
    $('overlay').style.display = 'none';
  }
  function togglePause() {
    if (state === 'play') {
      state = 'pause';
      renderOverlay(); $('overlay').style.display = 'flex';
    } else if (state === 'pause') { state = 'play'; $('overlay').style.display = 'none'; }
  }
  $('startBtn').onclick = () => { state === 'pause' ? togglePause() : start(); };

  const map = { ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right',
                ArrowUp:'up', w:'up', W:'up', ' ':'up' };
  addEventListener('keydown', e => {
    if (map[e.key]) {
      e.preventDefault();
      if (map[e.key] === 'up') { if (!e.repeat) jump(); return; }
      keys[map[e.key]] = true; if (state === 'play') moveCd = Math.min(moveCd, 0);
    }
    else if (e.key === 'p' || e.key === 'P') togglePause();
    else if (e.key === 'Enter' && (state === 'over' || state === 'menu')) start();
  });
  addEventListener('keyup', e => { if (map[e.key]) keys[map[e.key]] = false; });
  addEventListener('blur', () => { keys.left = keys.right = keys.up = false; });

  [['bL','left'],['bR','right'],['bU','up']].forEach(([id, k]) => {
    const el = $(id);
    const on = e => { e.preventDefault(); if (k === 'up') jump(); else keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
  });

  $('pad').addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  reset(); state = 'menu';
  applyLang();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
